name: b00k5 Continuous Integration & Sovereign Verification Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-static-analysis:
    name: Security Scan & Static Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install & Run Official Open-Source Gitleaks CLI
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . -v --config .gitleaks.toml

      - name: Run Sovereign Indian Statutory Secret & PII Scanner
        run: |
          chmod +x scripts/scan_secrets_and_pii.sh
          ./scripts/scan_secrets_and_pii.sh

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci --prefer-offline

      - name: Enforce Strict TypeScript Hygiene (tsc --noEmit)
        working-directory: apps/web
        run: npx tsc --project tsconfig.json --noEmit

  integration-and-statutory-engine:
    name: PostgreSQL 16, Redis 7 & MinIO Zero-Mock Verification
    runs-on: ubuntu-latest
    needs: security-and-static-analysis

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: b00k5_admin
          POSTGRES_PASSWORD: b00k5_secure_vault_password_2026
          POSTGRES_DB: b00k5_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b00k5_admin -d b00k5_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: ghcr.io/coollabsio/minio:latest
        env:
          MINIO_ROOT_USER: minio_storage_admin
          MINIO_ROOT_PASSWORD: minio_storage_secret_key_2026
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install System Dependencies (Poppler & PostgreSQL Dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev \
            poppler-utils \
            tesseract-ocr \
            postgresql-client

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx cryptography

      - name: Initialize PostgreSQL 16 Database Schema
        env:
          PGPASSWORD: b00k5_secure_vault_password_2026
        run: |
          psql -h localhost -U b00k5_admin -d b00k5_db -f init_schema.sql

      - name: Setup Sovereign MinIO Buckets
        run: |
          python -c '
          import boto3
          s3 = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="minio_storage_admin",
              aws_secret_access_key="minio_storage_secret_key_2026"
          )
          for b in ["b00k5-vault", "b00k5-receipts", "b00k5-statements", "b00k5-signed", "b00k5-statutory"]:
              try:
                  s3.create_bucket(Bucket=b)
              except Exception:
                  pass
          print("MinIO buckets initialized successfully.")
          '

      - name: Run Zero-Mock Backend Integration Suite
        env:
          DATABASE_URL: "postgresql+asyncpg://b00k5_admin:b00k5_secure_vault_password_2026@localhost:5432/b00k5_db"
          SYNC_DATABASE_URL: "postgresql://b00k5_admin:b00k5_secure_vault_password_2026@localhost:5432/b00k5_db"
          REDIS_URL: "redis://localhost:6379/0"
          MINIO_ENDPOINT: "http://localhost:9000"
          MINIO_ACCESS_KEY: "minio_storage_admin"
          MINIO_SECRET_KEY: "minio_storage_secret_key_2026"
          SECRET_KEY: "b00k5_default_dev_jwt_secret_key_change_in_prod_2026"
          PYTHONPATH: "apps/api"
        run: |
          pytest tests/integration/test_critical_fixes.py tests/integration/test_phase8_statutory_baseline_and_advance_tax.py -v

      - name: Execute Automated SRE Disaster Recovery Drill
        env:
          POSTGRES_USER: b00k5_admin
          POSTGRES_PASSWORD: b00k5_secure_vault_password_2026
          POSTGRES_DB: b00k5_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |
          python scripts/dr_drill.py

  container-build-verification:
    name: Docker Multi-Stage Image Build Verification
    runs-on: ubuntu-latest
    needs: security-and-static-analysis

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: b00k5-api:ci-test

      - name: Verify Frontend Container Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: b00k5-web:ci-test
